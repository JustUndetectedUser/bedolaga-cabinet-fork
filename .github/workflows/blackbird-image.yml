# BlackBird: образ кабинета в оформлении B1.
#
# Собирается из ветки blackbird и тегов bb-* и кладётся в GHCR этого
# репозитория. Адрес репозитория попадает в сборку как VITE_SOURCE_URL —
# это ссылка «Исходный код» в кабинете (AGPL-3.0, раздел 13).
#
# Теги образа: bb-<версия> для тега git (например bb-1.81.1-1), blackbird —
# последняя сборка ветки, sha-<коммит> — каждая сборка.
name: BlackBird image

on:
  workflow_dispatch:
  push:
    branches: [blackbird]
    tags: ['bb-*']

# Actions закреплены на коммитах, а не на тегах: тег можно переставить, а у задания есть право
# записи в пакеты (packages: write). В комментарии — тег, которому коммит соответствовал 14.11.2026.
permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm

      - name: Tests
        run: |
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          npx vitest run

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha

      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=/api
            VITE_APP_NAME=BlackBird
            VITE_SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
            VITE_LANDING_URL=https://blackbirdnet.com/
            VITE_GUEST_URL=/guest
            VITE_INVITE_URL=/invite/admin
            VITE_OFFERS_URL=/invite/offers
            VITE_GLOBE_BASE=/bb-globe/
