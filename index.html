<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="__APP_ICON__" />
    <link rel="manifest" href="__APP_MANIFEST__" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0f1a" />
    <!-- Страница сама ведёт обе темы. Без этого Android WebView (Telegram на
         Xiaomi с системным «тёмным режимом для приложений») затемняет её
         алгоритмом — по слоям и не за один кадр: цвета «прыгают». -->
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>__APP_NAME__</title>
    <meta name="application-name" content="__APP_NAME__" />
    <meta name="apple-mobile-web-app-title" content="__APP_NAME__" />
    <script data-hint="page-zoom">
      // BlackBird: масштаб на большом мониторе (владелец 21.11.2026, как на
      // лендинге). В окне больше 1440x800 по обеим сторонам кабинет — это
      // кабинет окна 1440x800 (по меньшей стороне), увеличенный целиком, как
      // зумом браузера: --bb-zoom и класс bb-zoom на <html>, zoom на <body> —
      // blackbird.css. Формула та же, что у --px лендинга (init.js pagePx):
      // менять вместе. До первой отрисовки, чтобы ничего не прыгало; дальше —
      // при каждом изменении окна. Меньше окно — ни класса, ни переменной,
      // кабинет как раньше.
      (() => {
        const html = document.documentElement;
        const set = () => {
          const z = Math.max(1, Math.min(window.innerWidth / 1440, window.innerHeight / 800));
          if (z > 1) {
            html.style.setProperty('--bb-zoom', String(z));
            html.classList.add('bb-zoom');
          } else {
            html.style.removeProperty('--bb-zoom');
            html.classList.remove('bb-zoom');
          }
        };
        set();
        window.addEventListener('resize', set);
      })();
    </script>
    <script>
      // Load Telegram Web App script only inside Telegram environment
      (function () {
        var isTelegram =
          window.TelegramWebviewProxy ||
          location.hash.indexOf('tgWebApp') !== -1 ||
          location.search.indexOf('tgWebApp') !== -1;
        if (isTelegram) {
          var s = document.createElement('script');
          s.src = 'https://telegram.org/js/telegram-web-app.js';
          s.async = true;
          document.head.appendChild(s);
        }
      })();
    </script>
    <style>
      /* Фон первой отрисовки — до того, как приедет CSS приложения. Светлый
         вариант соответствует champagne-200 из globals.css (.light body).
         Специфичность обоих правил обязана оставаться (0,0,1): фон темы в
         globals.css задаёт `.light body` (0,1,1) операторским цветом, а
         @layer base в Tailwind v3 — не настоящий каскадный слой. Более
         специфичный селектор здесь (например `html.light body`) навсегда
         перекрывал бы кастомный светлый фон. :where() обнуляет вклад класса. */
      body {
        background-color: #0a0f1a;
      }
      :where(html.light) body {
        background-color: #f7e7ce;
      }
      /* Схема следует классу темы, а не системной настройке: нативные контролы
         и скроллбары должны совпадать с выбранной темой. Дублируется в
         globals.css — здесь для первой отрисовки до его загрузки. */
      html.dark {
        color-scheme: dark;
      }
      html.light {
        color-scheme: light;
      }
    </style>
    <script>
      // Тема ДО первой отрисовки. useTheme вешает класс в useEffect, то есть уже
      // после неё, а тут зашиты class="dark" и тёмный фон — пользователь светлой
      // темы видел тёмную вспышку. Порядок разрешения повторяет useTheme:
      // сохранённый выбор -> системная тема -> тёмная. Ветку Telegram намеренно
      // не трогаем: colorScheme доступен только после init() SDK, а внутри
      // Telegram фон и так задаёт клиент.
      (function () {
        try {
          var enabled = { dark: true, light: true };
          try {
            var rawEnabled = localStorage.getItem('cabinet-enabled-themes');
            if (rawEnabled) {
              var parsed = JSON.parse(rawEnabled);
              if (parsed && typeof parsed === 'object') {
                enabled = { dark: parsed.dark !== false, light: parsed.light !== false };
              }
            }
          } catch (e) {}
          if (!enabled.dark && !enabled.light) enabled = { dark: true, light: true };

          var stored = null;
          try {
            stored = localStorage.getItem('cabinet-theme');
          } catch (e) {}

          // BlackBird: вход с лендинга (?from=landing&theme=…) открывает кабинет в
          // теме лендинга и запоминает её — дальше useTheme читает её как
          // сохранённый выбор. Решение владельца (19.11): светлый лендинг —
          // светлый кабинет, тёмный — тёмный, кэш включённых тем тут не
          // спрашивается. Без theme или с неверной — тёмная: старый лендинг был
          // только тёмным. Метку убирает landingEntry.ts.
          var handed = null;
          try {
            var q = new URLSearchParams(location.search);
            if (q.get('from') === 'landing') handed = q.get('theme') === 'light' ? 'light' : 'dark';
          } catch (e) {}
          if (handed) {
            try {
              localStorage.setItem('cabinet-theme', handed);
            } catch (e) {}
          }

          var theme;
          if (handed) {
            theme = handed;
          } else if (stored === 'light' || stored === 'dark') {
            theme = enabled[stored] ? stored : enabled.dark ? 'dark' : 'light';
          } else if (window.matchMedia('(prefers-color-scheme: light)').matches && enabled.light) {
            theme = 'light';
          } else {
            theme = enabled.dark ? 'dark' : 'light';
          }

          var root = document.documentElement;
          root.classList.remove('dark', 'light');
          root.classList.add(theme);
          if (theme === 'light') {
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#f7e7ce');
          }
        } catch (e) {
          // Хранилище заблокировано — остаётся тёмная тема из разметки.
        }
      })();
    </script>
    <script data-hint="theme-colors">
      // Палитра оператора ДО первой отрисовки. Цвета приходят с бэкенда уже после
      // загрузки JS, и каждая загрузка сначала показывала палитру по умолчанию,
      // а потом прыгала в операторскую. applyThemeColors записывает применённые
      // переменные в localStorage (ключ = STORAGE_KEYS.THEME_COLORS_HINT), здесь
      // они ставятся на :root теми же именами. Принимаются только --color-* с
      // hex или RGB-триплетом: подсказка не может подменить прочие токены.
      // Фон страницы и theme-color тоже берутся отсюда — до прихода CSS приложения
      // они иначе остаются цветами сборки. Специфичность правил фона (0,0,1)
      // обязательна, см. <style> выше.
      (function () {
        try {
          var raw = localStorage.getItem('cabinet-theme-colors-hint');
          if (!raw) return;
          var hint = JSON.parse(raw);
          var vars = hint && hint.vars;
          if (!vars || typeof vars !== 'object') return;
          var NAME = /^--color-[a-z0-9-]+$/;
          var VALUE = /^(#[0-9a-f]{6}|\d{1,3}, \d{1,3}, \d{1,3})$/i;
          var root = document.documentElement;
          var applied = {};
          for (var name in vars) {
            var value = vars[name];
            if (NAME.test(name) && typeof value === 'string' && VALUE.test(value)) {
              root.style.setProperty(name, value);
              applied[name] = value;
            }
          }
          var css = function (v) {
            return v.charAt(0) === '#' ? v : 'rgb(' + v + ')';
          };
          var dark = applied['--color-dark-950'];
          var light = applied['--color-champagne-200'];
          if (dark || light) {
            var style = document.createElement('style');
            style.textContent =
              (dark ? 'body{background-color:' + css(dark) + '}' : '') +
              (light ? ':where(html.light) body{background-color:' + css(light) + '}' : '');
            document.head.appendChild(style);
          }
          var isLight = root.classList.contains('light');
          var chrome = isLight ? applied['--color-light-bg'] : applied['--color-dark-bg'];
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta && chrome) meta.setAttribute('content', css(chrome));
        } catch (e) {
          // Хранилище заблокировано или подсказка битая — остаётся палитра сборки.
        }
      })();
    </script>
    <script>
      // BlackBird: глобус фоном «Главной» и экрана входа. Список стран
      // (config.json) запрашивается сразу, параллельно с бандлом, и только на
      // этих двух адресах: на остальных он не нужен, а неиспользованный preload —
      // лишний запрос и предупреждение в консоли. as=fetch + crossorigin
      // (anonymous) дают режим cors и credentials same-origin — как у fetch() без
      // параметров в loadGlobe.ts, поэтому браузер отдаёт ему предзагруженный
      // ответ, второго запроса нет. Базу (VITE_GLOBE_BASE) подставляет Vite при
      // сборке; без переменной (пусто или не подставлено) глобуса нет.
      (() => {
        const base = '%VITE_GLOBE_BASE%';
        const path = location.pathname;
        if (!base || base.charAt(0) === '%' || (path !== '/' && path !== '/login')) return;
        const link = document.createElement('link');
        link.rel = 'preload';
        link.as = 'fetch';
        link.crossOrigin = 'anonymous';
        link.href = `${base}config.json`;
        document.head.appendChild(link);
      })();
    </script>
    <script data-hint="landing-entry">
      // BlackBird: вход с лендинга (?from=landing). Лендинг погас в свой фон, и
      // первая отрисовка кабинета того же цвета: иначе до бандла шёл бы фон темы
      // сборки (тёмно-синий или бежевый, пока нет палитры) — вспышка между двумя
      // кадрами фона лендинга. Цвет — bg метки (тема та же: её поставил скрипт
      // темы выше); нет или не тот — фон лендинга этой темы. Правило — как
      // markColors (landingEntry.ts): менять вместе, равенство проверяет тест.
      // Класс bb-entry-black назван, когда фон был только чёрным. Дальше ведёт
      // landingEntry.ts (main.tsx), он и снимает класс. «Уменьшить движение» —
      // входа нет.
      (() => {
        try {
          const q = new URLSearchParams(location.search);
          if (q.get('from') !== 'landing') return;
          if (window.matchMedia?.('(prefers-reduced-motion: reduce)').matches) return;
          const html = document.documentElement;
          const light = html.classList.contains('light');
          const hex = (v, d) => (v && /^[0-9a-f]{6}$/i.test(v) ? `#${v.toLowerCase()}` : d);
          const bg = hex(q.get('bg'), light ? '#e5e7eb' : '#000000');
          const fg = hex(q.get('fg'), light ? '#111827' : '#f5f5f5');
          const style = document.createElement('style');
          style.textContent = `html.bb-entry-black body{background-color:${bg}}`;
          document.head.appendChild(style);
          html.classList.add('bb-entry-black');
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', bg);
          // Глобус здесь — загрузка (landingEntry.ts: #root скрыт,
          // пока страница не готова), поэтому его файлы идут первыми, раньше
          // бандла, а слой строится, не дожидаясь приложения: сразу, как пришли
          // файлы, если точки будут на GPU (кадр около 1,5 мс, запуску не мешает),
          // иначе после первой отрисовки приложения. Слой забирает CabinetGlobe
          // (earlyGlobe.ts), config и модуль — loadGlobe: один запрос каждого.
          // Параметры глобуса — как в createLayer (CabinetGlobeImpl.tsx): менять
          // вместе, их равенство проверяет тест.
          const base = '%VITE_GLOBE_BASE%';
          if (!base || base.charAt(0) === '%') return;
          // глобус — только «Главная» и вход (как предзагрузка config.json выше)
          if (location.pathname !== '/' && location.pathname !== '/login') return;
          const num = (s) => (s?.trim() ? Number(s) : Number.NaN);
          const lon = num(q.get('lon'));
          const at = num(q.get('t'));
          const ok = Number.isFinite(lon) && Number.isFinite(at) && Math.abs(at - Date.now()) <= 600000;
          // Перелёт: глобус лендинга по нажатию летит на место глобуса кабинета, а
          // браузер меняет страницу посреди перелёта. Лендинг передаёт, где его глобус
          // стоял в момент нажатия и сколько длится перелёт (fly=x,y,R,lat,ms: центр в
          // окне и радиус в px, широта вида, мс). Рисовал он, пока не пришёл первый
          // байт ответа кабинета (cut). Глобус кабинета продолжает с того кадра,
          // который лендинг показал последним (опция arrive модуля): перелёт — с той
          // же точки, вращение — с той же долготы. Без этого он вставал сразу на место:
          // рывок, если страница сменилась посреди перелёта.
          const fly = (q.get('fly') || '').split(',').map(num);
          const nav = performance.getEntriesByType?.('navigation')[0];
          const cut = nav?.responseStart > 0 ? Date.now() - (performance.now() - nav.responseStart) : Number.NaN;
          const arrive =
            ok && fly.length === 5 && fly.every(Number.isFinite) && fly[2] > 0 && fly[4] > 0 && Number.isFinite(cut)
              ? { x: fly[0], y: fly[1], R: fly[2], lat: fly[3], at, ms: fly[4], cut }
              : null;
          const early = { base, layer: null, adopted: false, dropped: false };
          window.__bbGlobeEarly = early;
          // config.json как он нужен глобусу: версия файлов и страны
          const valid = (c) =>
            !!c &&
            ((typeof c.v === 'string' && c.v !== '') || Number.isFinite(c.v)) &&
            !!c.servers &&
            typeof c.servers === 'object' &&
            !Array.isArray(c.servers);
          // Подсказка: config.json прошлого визита. С ней модуль и данные
          // запрашиваются сразу, не дожидаясь ответа на config.json (он первый в
          // цепочке: без подсказки глобус позже на целый запрос). Хранилище может
          // быть недоступно (приватный режим, WebView) — тогда без неё.
          const HINT = 'bb-globe-config-hint';
          const stored = () => {
            try {
              const c = JSON.parse(localStorage.getItem(HINT));
              return valid(c) ? { v: c.v, servers: c.servers } : null;
            } catch {
              return null;
            }
          };
          const remember = (c) => {
            try {
              if (c) localStorage.setItem(HINT, JSON.stringify({ v: c.v, servers: c.servers }));
              else localStorage.removeItem(HINT);
            } catch {
              // нет хранилища — следующий вход пойдёт без подсказки
            }
          };
          // Модуль и данные версии config.v — параллельно и с высоким приоритетом:
          // на входе с лендинга глобус — первое, что видит человек. fetch() модуля
          // возьмёт предзагруженные данные (as=fetch + crossorigin — тот же режим),
          // import() — предзагруженный модуль: второго запроса нет.
          const files = (config) => {
            const v = encodeURIComponent(String(config.v));
            const link = (rel, href) => {
              const el = document.createElement('link');
              el.rel = rel;
              el.setAttribute('fetchpriority', 'high');
              el.crossOrigin = 'anonymous';
              el.href = href;
              return el;
            };
            const data = link('preload', `${base}globe-data.json?v=${v}`);
            data.setAttribute('as', 'fetch');
            document.head.appendChild(data);
            document.head.appendChild(link('modulepreload', `${base}bb-globe.js?v=${v}`));
            return import(`${base}bb-globe.js?v=${v}`).then((mod) => ({ config, mod }));
          };
          const fresh = fetch(`${base}config.json`, { priority: 'high' })
            .then((r) => (r.ok ? r.json() : null))
            .then((c) => (valid(c) ? c : null))
            .catch(() => null);
          const hint = stored();
          // свежий список — в подсказку следующему входу (неверный или 404 — её нет)
          fresh.then(remember);
          // Первая отрисовка с глобусом (владелец 20.11: мигание на стыке). Браузер
          // показывает первую отрисовку кабинета, а глобус приходит позже: между
          // глобусом лендинга и глобусом кабинета был чёрный кадр 0,1-0,15 с. С
          // подсказкой и перелётом модуль и данные идут статическим импортом в модуле
          // с blocking="render" (Chrome): браузер держит на экране последний кадр
          // лендинга, пока этот модуль не выполнился, а он строит глобус с данными
          // (опция data модуля: первый кадр — сразу, в конструкторе). Не выполнился за
          // HOLD_MS (файлы не в кэше) — скрипт убирается, отрисовка идёт, загрузка —
          // как без него (тот же модуль и те же данные, по одному запросу). Без
          // blocking (Firefox, Safari) — как раньше.
          const HOLD_MS = 300;
          let holdable = false;
          try {
            holdable = !!hint && !!arrive && 'blocking' in HTMLScriptElement.prototype;
          } catch {
            // нет HTMLScriptElement — как раньше
          }
          // Упрощённый глобус (владелец 20.11, замер в Firefox на Windows). Между
          // двумя сайтами Firefox не держит лендинг на экране до первой отрисовки
          // кабинета: показывает пустую вкладку, потом фон кабинета без глобуса,
          // пока его не построили (0,1-0,15 с). Без пути с blocking (Firefox; Chrome
          // без подсказки) здесь, до первой отрисовки, рисуются точки суши
          // (DOTS_KEY: { v, rows } globe-data.json, их кладёт этот же скрипт ниже)
          // там, где глобус лендинга был в момент обрыва: его перелёт (easeOut
          // модуля) к месту глобуса кабинета (cabinetView модуля), вращение до того -
          // как модуль рисует их на холсте 2D (проекция, четыре полосы, край диска).
          // Холст уходит с первым кадром глобуса (onReady ниже), с концом входа или
          // через QUICK_MAX_MS. Так же рисует их лендинг на возврате (return.js):
          // менять вместе.
          const DOTS_KEY = 'bb-globe-dots';
          const QUICK_MAX_MS = 3000;
          const dots = (g, rows, cx, cy, R, lat0, lon0, W, H, ink) => {
            const D = Math.PI / 180;
            const sp = Math.sin(lat0 * D);
            const cp = Math.cos(lat0 * D);
            const c0 = Math.cos(lon0 * D);
            const s0 = Math.sin(lon0 * D);
            // как у модуля с опцией px: на большом окне (зум) точки крупнее
            const base = Math.max(0.55, Math.min(1.5 * Math.max(1, Math.min(W / 1440, H / 800)), R / 560));
            const bands = [[], [], [], []];
            for (const row of rows) {
              const la = row[0] * D;
              const sl = Math.sin(la);
              const cl = Math.cos(la);
              for (let q = 2; q + 1 < row.length; q += 2) {
                for (let j = row[q]; j < row[q] + row[q + 1]; j++) {
                  const lo = (-180 + ((j + 0.5) * 360) / row[1]) * D;
                  const cL = Math.cos(lo);
                  const sL = Math.sin(lo);
                  const cc = cL * c0 + sL * s0;
                  const cosc = sp * sl + cp * cl * cc;
                  if (cosc <= 0.02) continue;
                  const x = cx + R * cl * (sL * c0 - cL * s0);
                  const y = cy - R * (cp * sl - sp * cl * cc);
                  if (x < -4 || x > W + 4 || y < -4 || y > H + 4) continue;
                  bands[cosc > 0.75 ? 3 : cosc > 0.5 ? 2 : cosc > 0.25 ? 1 : 0].push(x, y);
                }
              }
            }
            g.beginPath();
            g.arc(cx, cy, R, 0, 2 * Math.PI);
            g.strokeStyle = `rgba(${ink}, 0.1)`;
            g.lineWidth = 1;
            g.stroke();
            bands.forEach((p, b) => {
              if (!p.length) return;
              const r = base * (0.7 + 0.12 * b);
              g.beginPath();
              for (let i = 0; i < p.length; i += 2) {
                g.moveTo(p[i] + r, p[i + 1]);
                g.arc(p[i], p[i + 1], r, 0, 2 * Math.PI);
              }
              g.fillStyle = `rgba(${ink}, ${[0.13, 0.2, 0.27, 0.34][b]})`;
              g.fill();
            });
          };
          const quick = () => {
            const rows = JSON.parse(localStorage.getItem(DOTS_KEY))?.rows;
            if (!Array.isArray(rows) || !rows.length) return null;
            const c = document.createElement('canvas');
            const g = c.getContext('2d');
            if (!g) return null;
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const W = innerWidth;
            const H = innerHeight;
            c.width = Math.round(W * dpr);
            c.height = Math.round(H * dpr);
            c.className = 'bb-globe-quick';
            c.setAttribute('aria-hidden', 'true');
            c.style.cssText =
              'position:fixed;left:0;top:0;width:100%;height:100%;z-index:-1;pointer-events:none';
            const desk = W >= 1024;
            // как cabinetView модуля (260 — в пикселях вёрстки: большое окно в зуме, page-zoom выше)
            const px = Math.max(1, Math.min(W / 1440, H / 800));
            const zoom = desk ? W / 4 + 260 * px : Math.min(1024 / 4 + 260, (Math.min(W, H) * 400) / 390);
            const e = 1 - (1 - Math.min(1, Math.max(0, (arrive.cut - arrive.at) / arrive.ms))) ** 4;
            const ink = light
              ? [1, 3, 5].map((i) => Number.parseInt(fg.slice(i, i + 2), 16)).join(', ')
              : '255, 255, 255';
            g.setTransform(dpr, 0, 0, dpr, 0, 0);
            dots(
              g,
              rows,
              arrive.x + ((desk ? 0.75 : 0.62) * W - arrive.x) * e,
              arrive.y + ((desk ? 0.55 : 0.49) * H - arrive.y) * e,
              arrive.R + (zoom - arrive.R) * e,
              arrive.lat + (30 - arrive.lat) * e,
              lon - ((arrive.cut - at) / 1000) * 5,
              W,
              H,
              ink,
            );
            html.appendChild(c);
            const mo = new MutationObserver(() => {
              if (!html.classList.contains('bb-entry-black')) drop();
            });
            const timer = setTimeout(() => drop(), QUICK_MAX_MS);
            const drop = () => {
              c.remove();
              mo.disconnect();
              clearTimeout(timer);
            };
            mo.observe(html, { attributes: true, attributeFilter: ['class'] });
            return drop;
          };
          early.dropQuick = () => {};
          if (arrive && !holdable) {
            try {
              early.dropQuick = quick() || early.dropQuick;
            } catch {
              // хранилища нет или точки битые — без упрощённого глобуса
            }
          }
          const hold = (config) =>
            new Promise((done) => {
              const v = encodeURIComponent(String(config.v));
              let got = false;
              early.now = (mod, data) => {
                got = true;
                early.data = data;
                done({ config, mod });
                // точки на GPU — строим сейчас, до первой отрисовки; без GPU — после
                // первой отрисовки приложения, как раньше (ниже)
                const go = () => {
                  if (!html.classList.contains('bb-entry-black')) return;
                  if (typeof mod?.BBGlobe !== 'function' || typeof mod.cabinetView !== 'function') return;
                  let gpu = false;
                  try {
                    gpu = mod.gpuDots?.() === true;
                  } catch {
                    // WebGL не дали — как без GPU
                  }
                  if (!gpu || early.layer || early.dropped || early.adopted) return;
                  ahead = true;
                  build(config, mod);
                };
                // <body> ещё нет (модуль из кэша выполнился раньше, чем парсер до него
                // дошёл): как только он вставлен — до первой отрисовки
                if (document.body) go();
                else
                  new MutationObserver((_, mo) => {
                    if (!document.body) return;
                    mo.disconnect();
                    go();
                  }).observe(html, { childList: true });
              };
              const s = document.createElement('script');
              s.type = 'module';
              s.setAttribute('blocking', 'render');
              s.textContent =
                `import * as m from '${base}bb-globe.js?v=${v}';` +
                `import d from '${base}globe-data.json?v=${v}' with { type: 'json' };` +
                'window.__bbGlobeEarly.now(m, d);';
              document.head.appendChild(s);
              setTimeout(() => {
                s.remove();
                if (!got) done(files(config));
              }, HOLD_MS);
            });
          early.load = (
            holdable ? hold(hint) : hint ? files(hint) : fresh.then((c) => (c ? files(c) : null))
          ).catch(() => null);
          // точки для упрощённого глобуса следующего входа: раз на версию данных,
          // через QUICK_MAX_MS после загрузки (данные к тому времени в кэше)
          early.load.then((got) => {
            const c = got?.config;
            if (!valid(c)) return;
            setTimeout(() => {
              const v = String(c.v);
              try {
                if (JSON.parse(localStorage.getItem(DOTS_KEY))?.v === v) return;
              } catch {
                return;
              }
              const keep = (d) => {
                if (Array.isArray(d?.rows)) localStorage.setItem(DOTS_KEY, JSON.stringify({ v, rows: d.rows }));
              };
              // данные модуля с blocking уже здесь; иначе — из кэша
              if (early.data) {
                try {
                  keep(early.data);
                } catch {
                  // хранилище полно — без упрощённого глобуса
                }
                return;
              }
              fetch(`${base}globe-data.json?v=${encodeURIComponent(v)}`)
                .then((r) => r.json())
                .then(keep)
                .catch(() => {});
            }, QUICK_MAX_MS);
          });
          // Без GPU строится — когда приложение отрисовалось (первый узел в #root):
          // до того главный поток — бандлу и React (кадр холста и его передача на
          // экран без GPU стоят десятки мс), а сеть уже вся сделана. Не
          // DOMContentLoaded и не createRoot: #root ищем сами, как только парсер до
          // него дойдёт.
          const rendered = new Promise((go) => {
            const wait = () => {
              const root = document.getElementById('root');
              if (!root) return setTimeout(wait, 5);
              if (root.firstChild) return go();
              new MutationObserver((_, mo) => {
                mo.disconnect();
                go();
              }).observe(root, { childList: true });
            };
            wait();
          });
          // Слою нужен <body>: скрипт стоит в <head>, а файлы из кэша приходят раньше,
          // чем парсер до него дойдёт.
          const body = new Promise((go) => {
            const wait = () => (document.body ? go() : setTimeout(wait, 5));
            wait();
          });
          // Слой глобуса с параметрами createLayer (CabinetGlobeImpl.tsx). Когда — см.
          // в конце: с точками на GPU сразу; без GPU страница с глобусом («Вход»,
          // «Главная») обычно приходит вскоре после первой отрисовки — тогда слой
          // строится при ней (claimEarlyLayer зовёт early.build: всё уже загружено),
          // и его кадр не отнимает главный поток у её запуска. Не пришла за 250 мс —
          // приложение ждёт сеть, поток свободен: глобус встаёт на место сам и ждёт
          // её (hold).
          // ahead: строится до приложения (точки на GPU). Тогда без проверки устройства
          // (spinGate): пока приложение запускается, кадры идут с опозданием, и она
          // остановила бы глобус ни за что. Её параметры — у слоя (layer.gate):
          // earlyGlobe.ts включает её, когда вход кончился (checkDevice модуля).
          let ahead = false;
          const build = (c, m) => {
            const v = c.v;
            const phone = innerWidth < 1024;
            const gate = { frames: 30, medianMs: 8, minFps: phone ? 28 : 55, recheckMs: 5000 };
            const later = ahead && typeof m.BBGlobe.prototype.checkDevice === 'function';
            const el = document.createElement('div');
            el.className = 'bb-globe-layer';
            el.setAttribute('aria-hidden', 'true');
            document.body.appendChild(el);
            // Цвета лендинга, как их дал бы globeColors на фоне bb-entry-black:
            // тёмная — белый глобус, светлая — цветом текста, обводки 0.85,
            // «дождь» 0.6 (globeColors.ts); fade — фон.
            // Запись — как у вычисленных стилей (rgb()), которые читает globeColors:
            // при равных палитрах забранный слой не перекрашивается.
            const rgb = (h) => [1, 3, 5].map((i) => Number.parseInt(h.slice(i, i + 2), 16)).join(', ');
            const fade = `rgb(${rgb(bg)})`;
            const colors = light
              ? {
                  dot: `rgb(${rgb(fg)})`,
                  ring: `rgba(${rgb(fg)}, 0.85)`,
                  rain: `rgba(${rgb(fg)}, 0.6)`,
                  fade,
                }
              : { dot: '#ffffff', ring: '#ffffff', rain: '#ffffff', fade };
            const layer = { el, colors, ready: false, onReady: null, faded: false, gate: later ? gate : null };
            const view = (k) => (w, h) => m.cabinetView(w, h)[k];
            try {
              layer.globe = new m.BBGlobe(el, {
                dataUrl: `${base}globe-data.json?v=${encodeURIComponent(String(v))}`,
                // данные уже пришли (модуль с blocking выше): первый кадр — сразу
                ...(early.data ? { data: early.data } : {}),
                servers: c.servers,
                spin: 5,
                spinFrom: ok ? { lon, at } : null,
                // перелёт лендинга — дальше с того места, где он его оборвал
                arrive,
                tilt: 30,
                labels: false,
                nav: 'none',
                // после первого кадра — стоит, пока его не заберёт страница (resume):
                // вращение не отнимает главный поток у запуска приложения. С точками
                // на GPU (кадр дешёвый) — не стоит с самого начала: первый кадр может
                // быть уже в конструкторе (data), и он продолжает перелёт лендинга
                // (стоящий глобус перелёт не берёт)
                hold: !ahead,
                maxFps: phone ? 30 : 0,
                spinGate: later ? false : gate,
                colors,
                focusX: view('focusX'),
                focusY: view('focusY'),
                zoom: view('zoom'),
                // точки крупнее на большом окне, как у слоя приложения
                px: typeof m.layoutPx === 'function' ? m.layoutPx : 1,
                onReady: () => {
                  layer.ready = true;
                  // первый кадр глобуса нарисован (до этой отрисовки) — упрощённый уходит
                  early.dropQuick();
                  // вход кончился, а страница слой не забрала (settleEarlyLayer) — не показывать
                  if (!layer.faded) {
                    // Принял перелёт лендинга, и ожидание входа ещё идёт: глобус
                    // лендинга только что был на экране — сразу, без проявления.
                    // Без перелёта (страница была прокручена мимо глобуса) и
                    // опоздавший проявляются как обычно.
                    if (arrive && html.classList.contains('bb-entry-black')) {
                      el.classList.add('bb-globe-layer--instant');
                    }
                    el.classList.add('is-ready');
                  }
                  layer.onReady?.();
                },
              });
              early.layer = layer;
              // Точки суши на GPU (модуль решает сам, свойство gpu): кадр стоит около
              // 1,5 мс и запуску приложения не мешает — глобус не стоит до страницы, а
              // сразу продолжает перелёт и вращение. Без GPU — стоит, как раньше.
              if (layer.globe.gpu) layer.globe.resume?.();
            } catch {
              el.remove();
            }
          };
          Promise.all([early.load, body])
            .then(([got]) => {
              const c = got?.config;
              const m = got?.mod;
              if (!valid(c)) return;
              if (typeof m?.BBGlobe !== 'function' || typeof m.cabinetView !== 'function') return;
              early.build = () => {
                if (!early.layer && !early.dropped && !early.adopted) build(c, m);
              };
              // сам — только пока идёт вход: кончился без страницы — экран без глобуса
              const self = () => {
                if (html.classList.contains('bb-entry-black')) early.build();
              };
              // Точки будут на GPU (модуль проверяет сам; у модуля до gpuDots() —
              // прежний путь): строим сейчас, приложение ждать незачем.
              let gpu = false;
              try {
                gpu = m.gpuDots?.() === true;
              } catch {
                // WebGL не дали — как без GPU
              }
              ahead = gpu;
              if (gpu) self();
              else rendered.then(() => setTimeout(self, 250));
            })
            .catch(() => {});
        } catch {
          // что-то не так — первая отрисовка как обычно, глобус построит React
        }
      })();
    </script>
    <script>
      // Имя бренда до первой отрисовки — без шагов при установке.
      //
      // Имя живёт у бота, а страница у всех вариантов установки одна и та же
      // (готовый образ собран с «Cabinet»). Ждать React — секунды на медленной
      // сети, и вкладка с ярлыками успевают взять значение сборки. Поэтому здесь,
      // ещё до загрузки бандла: (1) подсказка прошлого визита из localStorage
      // (её пишет useDocumentBranding, ключ STORAGE_KEYS.BRAND_HINT); (2) запрос
      // /cabinet/branding к API — он публичный, и прокси на API есть у каждой
      // установки. React, когда доберётся, поставит data-brand-ready на <html> —
      // после этого мы уже ничего не трогаем.
      //
      // Фавикон здесь НЕ трогаем: <link rel="icon"> выше ведёт на
      // /cabinet/branding/favicon у бота — Safari берёт иконку только при
      // загрузке страницы и не замечает смену через JS. И ни в коем случае не
      // на /cabinet/branding/logo: запрос фавикона идёт без Origin, его ответ
      // без CORS-заголовков ложится в кеш, и fetch() логотипа из React получает
      // из кеша копию без Access-Control-Allow-Origin. Подсказка прошлого визита
      // (PNG data: URI) — единственное исключение: сети в ней нет. SVG из
      // подсказки не берём: Safari рисует SVG-фавикон монохромной плиткой с
      // буквой, и подменив ссылку, мы лишили бы его логотипа с эндпоинта бота.
      // __API_URL__ подставляет vite-plugins/brandingHtml из VITE_API_URL.
      (function () {
        var API = '__API_URL__';
        var HINT_KEY = 'cabinet-brand-hint';

        function applyName(name) {
          document.title = name;
          var metas = document.querySelectorAll(
            'meta[name="application-name"], meta[name="apple-mobile-web-app-title"]'
          );
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', name);
        }
        function setIcon(href) {
          var icon = document.querySelector('link[rel="icon"]');
          if (icon) icon.setAttribute('href', href);
        }
        function firstLetter(value, fallback) {
          var ch = (value || '').replace(/^\s+/, '').charAt(0).toUpperCase();
          return ch || fallback;
        }

        var hint = null;
        try {
          hint = JSON.parse(localStorage.getItem(HINT_KEY) || 'null');
          if (hint && typeof hint.name === 'string' && hint.name.trim()) applyName(hint.name.trim());
          if (hint && typeof hint.icon === 'string' && hint.icon.indexOf('data:image/png;') === 0) {
            setIcon(hint.icon);
          }
        } catch (e) {
          // Хранилище заблокировано или подсказка битая — остаются значения сборки.
          hint = null;
        }

        if (typeof fetch !== 'function') return;
        var base = API.replace(/\/+$/, '');
        fetch(base + '/cabinet/branding', { credentials: 'omit' })
          .then(function (response) {
            return response.ok ? response.json() : null;
          })
          .then(function (brand) {
            if (!brand || typeof brand.name !== 'string') return;
            if (document.documentElement.hasAttribute('data-brand-ready')) return;
            var name = brand.name.trim();
            var letter = firstLetter(
              typeof brand.logo_letter === 'string' ? brand.logo_letter : '',
              firstLetter(name, 'V')
            );
            if (name) applyName(name);
            if (!hint) {
              try {
                localStorage.setItem(HINT_KEY, JSON.stringify({ name: name, letter: letter }));
              } catch (e) {
                // Хранилище заблокировано — следующий визит снова спросит API.
              }
            }
          })
          .catch(function () {
            // API недоступен — React покажет свой экран, вкладка останется со сборкой.
          });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
